<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Turnaround signal to action flow</title>
  <desc id="desc">Animated green signal traveling through fleet, geofence, dwell, and action stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0a051b"/><stop offset="1" stop-color="#250c77"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#10b981" stop-opacity="0"/><stop offset=".5" stop-color="#6ee7b7"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></linearGradient>
    <style>
      .flow { stroke-dasharray: 12 18; animation: move 2.4s linear infinite; }
      .node { animation: blink 2.4s ease-in-out infinite; }
      .node.two { animation-delay: .6s; }.node.three { animation-delay: 1.2s; }.node.four { animation-delay: 1.8s; }
      @keyframes move { to { stroke-dashoffset: -60; } }
      @keyframes blink { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="260" rx="24" fill="url(#bg)"/>
  <path d="M100 130H1100" stroke="#6ee7b7" stroke-opacity=".18" stroke-width="3"/>
  <path d="M100 130H1100" stroke="url(#line)" stroke-width="4" class="flow"/>
  <g fill="#0b0928" stroke="#6ee7b7" stroke-width="2">
    <circle cx="170" cy="130" r="38" class="node"/>
    <circle cx="430" cy="130" r="38" class="node two"/>
    <circle cx="690" cy="130" r="38" class="node three"/>
    <circle cx="950" cy="130" r="38" class="node four"/>
  </g>
  <g fill="#fff" font-family="sans-serif" text-anchor="middle">
    <text x="170" y="126" font-size="12" font-weight="700">SIGNAL</text><text x="170" y="143" font-size="10" fill="#a7f3d0">fleet movement</text>
    <text x="430" y="126" font-size="12" font-weight="700">GEOFENCE</text><text x="430" y="143" font-size="10" fill="#a7f3d0">facility context</text>
    <text x="690" y="126" font-size="12" font-weight="700">DWELL</text><text x="690" y="143" font-size="10" fill="#a7f3d0">time understood</text>
    <text x="950" y="126" font-size="12" font-weight="700">ACTION</text><text x="950" y="143" font-size="10" fill="#a7f3d0">cost avoided</text>
  </g>
  <text x="600" y="54" text-anchor="middle" fill="#ed642b" font-family="monospace" font-size="14" font-weight="700" letter-spacing="3">TURNAROUND // FROM SIGNAL TO DECISION</text>
  <text x="600" y="220" text-anchor="middle" fill="#d1d5db" font-family="sans-serif" font-size="13">Every movement becomes context. Every delay becomes actionable intelligence.</text>
</svg>
