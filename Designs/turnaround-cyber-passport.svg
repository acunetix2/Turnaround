<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Turnaround cyber logistics identity</title>
  <desc id="desc">A stylized human robot profile with green horizontal scanning strips.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08051a"/>
      <stop offset="0.55" stop-color="#17114a"/>
      <stop offset="1" stop-color="#250c77"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1">
      <stop offset="0" stop-color="#ed642b"/>
      <stop offset="1" stop-color="#ffb15c"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="portrait"><path d="M405 324c14-77 57-111 94-126-13-18-20-42-20-68 0-61 40-104 91-104s91 43 91 104c0 26-7 50-20 68 37 15 80 49 94 126z"/></clipPath>
    <style>
      .scan { animation: scan 3.2s ease-in-out infinite; }
      .scan.two { animation-delay: 1.1s; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes scan { 0%,100% { transform: translateY(-30px); opacity: .15; } 50% { transform: translateY(160px); opacity: .95; } }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <g opacity=".16" stroke="#6ee7b7" stroke-width="1">
    <path d="M35 72h1130M35 114h1130M35 156h1130M35 198h1130M35 240h1130M35 282h1130M35 324h1130"/>
    <path d="M72 34v352M144 34v352M216 34v352M984 34v352M1056 34v352M1128 34v352"/>
  </g>
  <circle cx="600" cy="205" r="157" fill="none" stroke="#10b981" stroke-width="1" opacity=".35"/>
  <circle cx="600" cy="205" r="173" fill="none" stroke="#ed642b" stroke-width="2" stroke-dasharray="3 13" opacity=".65" class="pulse"/>
  <path d="M405 324c14-77 57-111 94-126-13-18-20-42-20-68 0-61 40-104 91-104s91 43 91 104c0 26-7 50-20 68 37 15 80 49 94 126z" fill="#111827" stroke="#6ee7b7" stroke-width="3"/>
  <g clip-path="url(#portrait)">
    <path d="M474 130h252M466 153h268M458 176h284M450 199h300M442 222h316M434 245h332M426 268h348M418 291h364" stroke="url(#green)" stroke-width="7" opacity=".7"/>
    <path d="M536 110h128v122H536z" fill="none" stroke="#6ee7b7" stroke-width="2" opacity=".75"/>
    <path d="M558 161h28M614 161h28M571 194h58" stroke="#ed642b" stroke-width="6" stroke-linecap="round"/>
    <path d="M524 235c34 30 118 30 152 0" fill="none" stroke="#6ee7b7" stroke-width="3"/>
    <rect x="390" y="64" width="420" height="14" fill="url(#green)" class="scan" filter="url(#glow)"/>
    <rect x="390" y="64" width="420" height="8" fill="url(#green)" class="scan two" filter="url(#glow)"/>
  </g>
  <g fill="#d1fae5" font-family="monospace">
    <text x="74" y="92" font-size="14">IDENTITY // TURNAROUND</text>
    <text x="74" y="118" font-size="11" opacity=".7">CORRIDOR INTELLIGENCE NODE</text>
    <text x="908" y="92" font-size="14">STATUS: ONLINE</text>
    <text x="908" y="118" font-size="11" opacity=".7">SIGNAL / DWELL / ACTION</text>
  </g>
  <path d="M100 358h310M790 358h310" stroke="url(#orange)" stroke-width="2"/>
  <text x="600" y="369" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700" letter-spacing="4">ACUNETIX2 // BUILT FOR THE ROAD AHEAD</text>
</svg>
